name: ui-ux-pro-max
description: An AI skill that provides design intelligence for building professional UI/UX across multiple platforms
version: 2.0.0
author: nextlevelbuilder

# Auto-activation triggers
triggers:
  - ui
  - ux
  - design
  - style
  - color
  - typography
  - layout
  - component
  - frontend
  - interface

# Available commands
commands:
  - name: search
    description: Search UI/UX design patterns, styles, colors, or typography
    usage: python .opencode/skills/ui-ux-pro-max/scripts/search.py "<query>" [--domain <domain>]
    
  - name: design-system
    description: Generate a complete design system recommendation
    usage: python .opencode/skills/ui-ux-pro-max/scripts/search.py "<query>" --design-system [-p "Project Name"]

# Domains available for search
domains:
  - style
  - color
  - typography
  - product
  - landing
  - ux
  - chart
  - icons

# Data files
data_files:
  - data/styles.csv
  - data/colors.csv
  - data/typography.csv
  - data/products.csv

# Scripts
scripts:
  - scripts/core.py
  - scripts/design_system.py
  - scripts/search.py
